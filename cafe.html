<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CafeMaster Launcher</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #20120d;
        --card: #2d1b13;
        --text: #f8f0df;
        --muted: #c2b197;
        --accent: #e7b267;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top, rgba(231, 178, 103, 0.16), transparent 36%),
          linear-gradient(180deg, #2b1a13, #160c08);
        color: var(--text);
      }
      .card {
        width: min(92vw, 640px);
        background: rgba(45, 27, 19, 0.96);
        border: 1px solid rgba(231, 178, 103, 0.22);
        border-radius: 28px;
        padding: 32px;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 12px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 5vw, 3rem);
      }
      p {
        margin: 0 0 14px;
        color: var(--muted);
        line-height: 1.6;
      }
      code {
        color: var(--accent);
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
        padding: 12px 18px;
        border-radius: 999px;
        background: var(--accent);
        color: #24150f;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>CafeMaster is now a full project</h1>
      <p>
        The old single-file prototype was replaced with a phase-one project structure that uses
        <code>server.js</code>, a real SQLite database, and a responsive frontend in
        <code>/public</code>.
      </p>
      <p>Run <code>npm start</code> in this folder, then open <code>http://localhost:3000</code>.</p>
      <a href="http://localhost:3000">Open Running App</a>
    </main>
  </body>
</html>
