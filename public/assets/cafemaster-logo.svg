<svg
  width="180"
  height="180"
  viewBox="0 0 180 180"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="20" y1="10" x2="160" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171A2B"/>
      <stop offset="0.5" stop-color="#24162E"/>
      <stop offset="1" stop-color="#0D1220"/>
    </linearGradient>

    <!-- Main accent -->
    <linearGradient id="accent" x1="48" y1="45" x2="132" y2="137" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB86B"/>
      <stop offset="0.45" stop-color="#FF6B6B"/>
      <stop offset="1" stop-color="#B76CFF"/>
    </linearGradient>

    <!-- Cup gradient -->
    <linearGradient id="cup" x1="48" y1="68" x2="125" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8EA"/>
      <stop offset="0.5" stop-color="#FFD59A"/>
      <stop offset="1" stop-color="#FF9D68"/>
    </linearGradient>

    <!-- Coffee -->
    <linearGradient id="coffee" x1="58" y1="73" x2="111" y2="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4A2419"/>
      <stop offset="1" stop-color="#9A4F32"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix
        in="blur"
        type="matrix"
        values="
          1 0 0 0 1
          0 0.4 0 0 0.2
          0 0 1 0 1
          0 0 0 0.8 0"
      />
    </filter>

    <!-- Soft shadow -->
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="10"
        flood-color="#000000"
        flood-opacity="0.35"
      />
    </filter>

    <!-- Glass -->
    <linearGradient id="glass" x1="30" y1="20" x2="150" y2="150">
      <stop stop-color="white" stop-opacity="0.16"/>
      <stop offset="1" stop-color="white" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect
    width="180"
    height="180"
    rx="44"
    fill="url(#bg)"
  />

  <!-- Ambient glow -->
  <circle
    cx="90"
    cy="92"
    r="58"
    fill="url(#accent)"
    opacity="0.18"
    filter="url(#glow)"
  />

  <!-- Glass circle -->
  <circle
    cx="90"
    cy="90"
    r="66"
    fill="url(#glass)"
    stroke="white"
    stroke-opacity="0.08"
    stroke-width="1.5"
  />

  <!-- Decorative orbit -->
  <path
    d="M38 103C45 137 77 151 109 143C136 136 151 113 145 87"
    stroke="url(#accent)"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.45"
  />

  <!-- Steam glow -->
  <path
    d="M69 58C62 49 67 39 75 34C82 29 82 21 76 16"
    stroke="#FFB86B"
    stroke-width="5"
    stroke-linecap="round"
    opacity="0.25"
    filter="url(#glow)"
  />

  <path
    d="M69 58C62 49 67 39 75 34C82 29 82 21 76 16"
    stroke="url(#accent)"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <path
    d="M98 55C91 46 96 37 104 32C111 27 111 20 106 15"
    stroke="#FF8F70"
    stroke-width="5"
    stroke-linecap="round"
    opacity="0.22"
    filter="url(#glow)"
  />

  <path
    d="M98 55C91 46 96 37 104 32C111 27 111 20 106 15"
    stroke="url(#accent)"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Cup shadow -->
  <ellipse
    cx="91"
    cy="133"
    rx="45"
    ry="8"
    fill="#000"
    opacity="0.3"
    filter="url(#shadow)"
  />

  <!-- Cup body -->
  <path
    d="M48 76
       C48 68 54 62 62 62
       H111
       C119 62 125 68 125 76
       V99
       C125 116 111 128 94 128
       H79
       C62 128 48 116 48 99
       V76Z"
    fill="url(#cup)"
    filter="url(#shadow)"
  />

  <!-- Coffee opening -->
  <ellipse
    cx="86.5"
    cy="72"
    rx="36"
    ry="11"
    fill="url(#coffee)"
  />

  <!-- Coffee shine -->
  <path
    d="M62 69C70 64 86 63 99 67"
    stroke="#F7B58A"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.55"
  />

  <!-- Cup highlight -->
  <path
    d="M58 82V99C58 110 67 118 78 120"
    stroke="white"
    stroke-width="4"
    stroke-linecap="round"
    opacity="0.42"
  />

  <!-- Handle -->
  <path
    d="M124 76H132
       C143 76 150 84 150 94
       C150 105 143 113 132 113
       H124"
    stroke="url(#accent)"
    stroke-width="9"
    stroke-linecap="round"
    fill="none"
    opacity="0.9"
  />

  <!-- Handle inner -->
  <path
    d="M128 87H132
       C136 87 139 90 139 94
       C139 98 136 102 132 102
       H128"
    stroke="#261827"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Saucer -->
  <path
    d="M54 128C65 137 111 139 123 128"
    stroke="url(#accent)"
    stroke-width="5"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- Small sparkle -->
  <path
    d="M133 46V56M128 51H138"
    stroke="#FFD9A8"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <circle
    cx="39"
    cy="61"
    r="3"
    fill="#FF9F68"
  />

  <circle
    cx="143"
    cy="128"
    r="2.5"
    fill="#B76CFF"
  />
</svg>